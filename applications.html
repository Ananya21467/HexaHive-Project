<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexaHive - Central Registry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            min-height: 100vh;
            width: 100vw;
        }

        /* Fixed Left Control Sidebar Container Layout */
        .sidebar {
            width: 260px;
            background-color: #0c1e5b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            height: 100vh;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Main Workspace Canvas Area */
        .main-content {
            flex-grow: 1;
            margin-left: 260px;
            padding: 40px;
            width: calc(100vw - 260px);
            background-color: #f8fafc;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 20px;
        }

        .title-area h1 {
            color: #0f172a;
            font-size: 28px;
            font-weight: bold;
        }

        /* Filter Controls Bar Widget Component */
        .filter-bar {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid #e2e8f0;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        .filter-bar input, .filter-bar select {
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-input { flex-grow: 1; }

        /* Master Database Layout Card Container */
        .registry-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
        }

        .registry-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .registry-table th {
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            padding: 14px 16px;
            border-bottom: 2px solid #e2e8f0;
            font-weight: bold;
        }

        .registry-table td {
            padding: 18px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            color: #334155;
        }

        .status-dot {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .dot-pending { color: #b45309; }
        .dot-clear { color: #15803d; }

        .view-btn {
            background-color: #0c1e5b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .view-btn:hover { background-color: #061036; }
    </style>
</head>
<body>

    <!-- Shared Left Navigation Bar Side Navigation -->
    <div class="sidebar">
        <div class="brand-section">
            <span class="brand-name">HexaHive</span>
        </div>
        <div class="nav-links">
            <a href="authority-dashboard.html" class="nav-item">📊 Dashboard</a>
            <a href="applications.html" class="nav-item active">📋 Master Registry</a>
            <a href="verify-documents.html" class="nav-item">🔎 Verify Documents</a>
            <a href="update-status.html" class="nav-item">⚙️ Update Status</a>
            <a href="choose-role.html" class="nav-item" style="margin-top: auto;">👥 Change Role</a>
        </div>
    </div>

    <!-- Main Right Content Framework View Panel -->
    <div class="main-content">
        <div class="header-section">
            <div class="title-area">
                <h1>All Submitted Applications</h1>
            </div>
        </div>

        <!-- Dynamic Registry Filter Interface -->
        <div class="filter-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by Industrial Unit Title, Location, or Token ID...">
            <select id="sectorFilter">
                <option value="">All Sectors</option>
                <option value="Chemical">Chemical</option>
                <option value="Manufacturing">Manufacturing</option>
                <option value="Textiles">Textiles</option>
            </select>
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="submitted">submitted</option>
                <option value="Under Review">Documents Verified</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
            </select>
        </div>

        <!-- Master Registry Database Table Sheet Grid Container -->
        <div class="registry-card">
            <table id="registryTableBody" class="registry-table">
                <thead>
                    <tr>
                        <th>Application ID</th>
                        <th>Industrial Entity Name</th>
                        <th>Sector</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="registryTableBody">
                    <tr>
                        <td colspan="5">Loading applications...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>

    let applications = [];


    // -------------------------
    // LOAD APPLICATIONS
    // -------------------------

    async function loadApplications() {

        try {

            const response = await fetch(
                "http://localhost:5000/api/applications"
            );

            const data = await response.json();


            if (!response.ok) {

                alert(
                    data.message ||
                    "Failed to load applications."
                );

                return;
            }


            applications = data.applications;

            displayApplications(applications);


        } catch (error) {

            console.error(
                "Registry error:",
                error
            );

            document.getElementById(
                "registryTableBody"
            ).innerHTML = `

                <tr>

                    <td colspan="5">
                        Unable to connect to backend.
                    </td>

                </tr>

            `;

        }

    }


    // -------------------------
    // DISPLAY APPLICATIONS
    // -------------------------

    function displayApplications(list) {

        const tableBody =
            document.getElementById(
                "registryTableBody"
            );


        tableBody.innerHTML = "";


        if (list.length === 0) {

            tableBody.innerHTML = `

                <tr>

                    <td colspan="5">
                        No applications found.
                    </td>

                </tr>

            `;

            return;

        }


        list.forEach(function(application) {

            let statusClass = "dot-pending";

            let statusIcon = "⏳";


            if (application.status === "Approved") {

                statusClass = "dot-clear";
                statusIcon = "✅";

            }

            else if (application.status === "Rejected") {

                statusClass = "dot-pending";
                statusIcon = "❌";

            }


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    <strong>
                        ${application._id}
                    </strong>
                </td>

                <td>
                    ${application.projectName}
                </td>

                <td>
                    ${application.industryType}
                </td>

                <td>

                    <span class="status-dot ${statusClass}">

                        ${statusIcon}
                        ${application.status}

                    </span>

                </td>

                <td>

                    <button
                        class="view-btn"
                        onclick="processApplication('${application._id}')">

                        Process Request

                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        });

    }


    // -------------------------
    // SEARCH + FILTER
    // -------------------------

    function filterApplications() {

        const search =
            document.getElementById(
                "searchInput"
            ).value.toLowerCase();


        const sector =
            document.getElementById(
                "sectorFilter"
            ).value;


        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        const filtered =
            applications.filter(function(application) {

                const searchableText = `

                    ${application._id}

                    ${application.projectName}

                    ${application.industryType}

                    ${application.address}

                    ${application.state}

                    ${application.district}

                `.toLowerCase();


                const matchesSearch =
                    searchableText.includes(search);


                const matchesSector =
                    sector === "" ||
                    application.industryType
                        .toLowerCase()
                        .includes(
                            sector.toLowerCase()
                        );


                const matchesStatus =
                    status === "" ||
                    application.status === status;


                return (
                    matchesSearch &&
                    matchesSector &&
                    matchesStatus
                );

            });


        displayApplications(filtered);

    }


    // -------------------------
    // PROCESS APPLICATION
    // -------------------------

    function processApplication(id) {

        localStorage.setItem(
            "selectedApplicationId",
            id
        );


        window.location.href =
            "review-application.html";

    }


    // -------------------------
    // FILTER EVENTS
    // -------------------------

    document.getElementById(
        "searchInput"
    ).addEventListener(
        "input",
        filterApplications
    );


    document.getElementById(
        "sectorFilter"
    ).addEventListener(
        "change",
        filterApplications
    );


    document.getElementById(
        "statusFilter"
    ).addEventListener(
        "change",
        filterApplications
    );


    // Load data
    loadApplications();

</script>

</body>
</html>
